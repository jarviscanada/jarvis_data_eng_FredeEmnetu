# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: >
      The Linux Cluster Monitoring Agent (LCA) is a resource monitoring solution designed to track and 
      record the hardware specifications and real-time usage statistics of Linux nodes within a server cluster. 
      The system automatically collects CPU, memory, and disk data from each host and persists it to a centralized 
      PostgreSQL database for historical analysis and reporting.
  - name: "Java Grep Application"
    git_url: "/core_java/grep"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: >
      Built a Java command-line utility replicating Linux grep, recursively searching a directory tree and matching file lines against a user-supplied regex using java.nio and java.util.regex, 
      with SLF4J/Log4j logging. Identified a heap-memory risk in the initial implementation and outlined a fix path via JVM heap sizing and a planned refactor to lazy stream processing. 
      Containerized the app with Docker on an Alpine base image and published it to Docker Hub for consistent, JDK-free deployment. Verified functionality through manual testing 
      against sample files, including edge cases like empty directories and full-match regex patterns.
  - name: "Python Data Analysis"
    git_url: "/python_data_analytics"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: >
      Delivered a proof-of-concept customer analytics project for a UK giftware retailer facing stagnant revenue, using Python, Pandas, and NumPy in a Jupyter Notebook connected to a 
      Dockerized PostgreSQL warehouse. Performed RFM segmentation across ~5,900 customers into 10 behavioral segments, finding the top 5% of customers generated 52% of revenue, w
      ith 754 "At Risk" and 86 "Can't Lose" customers showing churn signs. Visualized findings with Matplotlib and delivered actionable recommendations (VIP retention, 
      win-back campaigns, seasonal timing) to the marketing team. Presented results as both a technical notebook and an executive presentation.
  - name: "Java Stock Quote App"
    git_url: "/core_java/stock_quote"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: >
      Built a terminal-based Java trading application integrating the Alpha Vantage API for live stock data, using JDBC to persist quotes, positions, 
      and trading activity to a PostgreSQL database, with OkHttp for HTTP requests and Jackson for JSON parsing. Applied the DAO pattern to separate CRUD logic from business logic, 
      keeping the service layer decoupled from SQL and testable via mocked dependencies. Validated functionality with JUnit 4 and Mockito unit tests against mocked DAOs, plus integration 
      tests against a live Dockerized PostgreSQL instance. Packaged the app with Maven and Docker for consistent setup and deployment.

